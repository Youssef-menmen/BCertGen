# ═══════════════════════════════════════════════════════════
#  Configuration PRODUCTION — Railway
#  Toutes les propriétés ont des valeurs par défaut
# ═══════════════════════════════════════════════════════════

server.port=${PORT:8080}

# ── Base de données ───────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ──────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Jackson ──────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Africa/Casablanca

# ── JWT — valeurs par défaut incluses ────────────────────
jwt.secret=${JWT_SECRET:emsi_default_secret_change_this_in_production_minimum_32_chars}
jwt.expiration=${JWT_EXPIRATION:28800000}

# ── SendGrid ─────────────────────────────────────────────
sendgrid.api-key=${SENDGRID_API_KEY:disabled}
sendgrid.from-email=${SENDGRID_FROM_EMAIL:noreply@emsi.ma}
sendgrid.from-name=${SENDGRID_FROM_NAME:EMSI Certificate Generator}

# ── CORS ─────────────────────────────────────────────────
app.frontend-url=${FRONTEND_URL:https://elaborate-granita-70728d.netlify.app}
app.cors.allowed-origins=${CORS_ORIGINS:*}

# ── Reset token ──────────────────────────────────────────
app.reset-token-expiry-hours=${RESET_TOKEN_HOURS:2}
